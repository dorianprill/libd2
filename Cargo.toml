[package]
name = "libd2"
version = "0.1.0"
description = """A Diablo II library for core and simple client functionality, 
                 written in Rust for performance, safety and re-usability."""
authors = ["Dorian Prill"]
repository = "https://github.com/dorianprill/libd2"
readme = "README.md"
keywords = ["diablo", "resurrected"]
categories = ["games"]
edition = "2024"
license = "MIT"


exclude = [
    "*.png",
    "*.jpg",
    "examples/*",
    ".github/*",
    ".gitignore",
    ".vscode/*",
]


[dependencies]
bzip2 = "0.6"
flate2 = "1"
pklib = "0.2"
netdev = "0.44.0"
etherparse = "0.20.1"
socket2 = { version = "0.6.4", features = ["all"] }
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.11.0"
